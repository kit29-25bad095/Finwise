version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: finora_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finora_prod}
      POSTGRES_USER: ${POSTGRES_USER:-finora_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
    ports:
      - "5432:5432"
    volumes:
      - finora_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finora_user} -d ${POSTGRES_DB:-finora_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: finora_redis_prod
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-finora_redis_secret}"]
    ports:
      - "6379:6379"
    volumes:
      - finora_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-finora_redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finora_backend_prod
    restart: always
    command: >
      sh -c "alembic upgrade head &&
             gunicorn -c gunicorn_conf.py app.main:app"
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-finora_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-finora_prod}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-finora_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-finora_prod}
      REDIS_URL: redis://:${REDIS_PASSWORD:-finora_redis_secret}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?Production SECRET_KEY must be provided}
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      BACKEND_CORS_ORIGINS: '["https://finora.yourdomain.com", "http://localhost:3100"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finora_worker_prod
    restart: always
    command: python -m rq worker -u redis://:${REDIS_PASSWORD:-finora_redis_secret}@redis:6379/0 high default low
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-finora_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-finora_prod}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-finora_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-finora_prod}
      REDIS_URL: redis://:${REDIS_PASSWORD:-finora_redis_secret}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?Production SECRET_KEY must be provided}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finora_frontend_prod
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:8000/api/v1}
    ports:
      - "3100:3100"
    depends_on:
      - backend

volumes:
  finora_pg_data:
  finora_redis_data:
