version: '3.8'

# Finora Production Multi-Container Infrastructure
# Implements strict network segregation, non-root least privilege,
# healthchecks, resource bounds, and zero public exposure of backing services.

networks:
  frontend_net:
    driver: bridge
    internal: false
  backend_net:
    driver: bridge
    internal: false
  data_net:
    driver: bridge
    internal: true  # Fully isolated internal data network (no outbound internet or inbound exposure)

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  finora_storage:
    driver: local  # Dedicated private volume for financial documents
  nginx_certs:
    driver: local
  certbot_challenge:
    driver: local

services:
  # 1. Reverse Proxy & SSL Termination
  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: finora-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_certs:/etc/nginx/certs:ro
      - certbot_challenge:/var/www/certbot:ro
    networks:
      - frontend_net
      - backend_net
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  # 2. Next.js Frontend UI
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finora-frontend
    restart: always
    expose:
      - "3100"
    environment:
      NODE_ENV: production
      PORT: 3100
      NEXT_PUBLIC_API_URL: /api/v1
    networks:
      - frontend_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1024M

  # 3. FastAPI Core Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finora-backend
    restart: always
    command: >
      sh -c "alembic upgrade head &&
             gunicorn -c gunicorn_conf.py app.main:app"
    expose:
      - "8000"
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-finora_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-finora_prod}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-finora_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-finora_prod}
      REDIS_URL: redis://:${REDIS_PASSWORD:-finora_redis_secret}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?Production SECRET_KEY must be provided}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      AI_MODEL: ${AI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      AI_API_KEY: ${GEMINI_API_KEY}
      WORKER_FALLBACK_SYNC: "False"
      FINORA_STORAGE_DIR: /var/finora/storage
      FILE_RETENTION_DAYS: ${FILE_RETENTION_DAYS:-2555}
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      BACKEND_CORS_ORIGINS: '["https://finora.yourdomain.com", "http://localhost:3100"]'
    volumes:
      - finora_storage:/var/finora/storage
    networks:
      - backend_net
      - data_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 2048M

  # 4. Asynchronous Background Task Worker (RQ Worker)
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.workers.worker_entrypoint", "finora_reconciliation_tasks"]
    container_name: finora-worker
    restart: always
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-finora_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-finora_prod}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-finora_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-finora_prod}
      REDIS_URL: redis://:${REDIS_PASSWORD:-finora_redis_secret}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?Production SECRET_KEY must be provided}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      AI_MODEL: ${AI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      AI_API_KEY: ${GEMINI_API_KEY}
      WORKER_FALLBACK_SYNC: "False"
      FINORA_STORAGE_DIR: /var/finora/storage
    volumes:
      - finora_storage:/var/finora/storage
    networks:
      - data_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 2048M

  # 5. Outbox Publisher & Orphan Investigation Reaper Scheduler
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.workers.scheduler"]
    container_name: finora-scheduler
    restart: always
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-finora_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-finora_prod}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-finora_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-finora_prod}
      REDIS_URL: redis://:${REDIS_PASSWORD:-finora_redis_secret}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?Production SECRET_KEY must be provided}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      AI_MODEL: ${AI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      AI_API_KEY: ${GEMINI_API_KEY}
      WORKER_FALLBACK_SYNC: "False"
      FINORA_STORAGE_DIR: /var/finora/storage
      FILE_RETENTION_DAYS: ${FILE_RETENTION_DAYS:-2555}
    volumes:
      - finora_storage:/var/finora/storage
    networks:
      - data_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  # 6. Production PostgreSQL Database (PostgreSQL 17)
  postgres:
    image: postgres:17-alpine
    container_name: finora-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finora_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      POSTGRES_DB: ${POSTGRES_DB:-finora_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finora_user} -d ${POSTGRES_DB:-finora_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 4096M

  # 7. Production Redis Queue & Broker (Redis 7)
  redis:
    image: redis:7-alpine
    container_name: finora-redis
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-finora_redis_secret}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    networks:
      - data_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-finora_redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1024M
